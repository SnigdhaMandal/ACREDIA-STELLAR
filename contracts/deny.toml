# Configuration for cargo-deny
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32v1-none",
]
all-features = true

# 1. Security advisories & vulnerabilities
[advisories]
vulnerability = "deny"
unmaintained = "warn"
unsound = "warn"
yanked = "warn"
ignore = [
    # paste 1.0.15 is an unmaintained transitive dependency of soroban-sdk, tracked in contracts/SECURITY_AUDIT.md F-9
    "RUSTSEC-2024-0436",
]

# 2. License compliance
[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
copyleft = "warn"

# 3. Crate bans & version control
[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

# 4. Source checking
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
